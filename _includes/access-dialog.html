<dialog id="access-dialog" class="access-dialog" aria-labelledby="access-heading">
<button type="button" class="access-close" data-close-access aria-label="Close access dialog">×</button><span class="access-emblem" aria-hidden="true">✧</span>
<h2 id="access-heading">A Key to Little Moments</h2><p>Unlock Daily, personal photographs and paper downloads in this tab.</p>
<form data-access-form><label for="access-code">Access Code</label><input id="access-code" name="access-code" type="password" required maxlength="6" minlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="access-feedback"><button type="submit">Unlock ↗</button></form>
<p id="access-feedback" role="status" aria-live="polite"></p><button type="button" class="access-relock" data-relock hidden>Lock Again</button>
<noscript><p>Enable JavaScript to use the access code.</p></noscript></dialog>
<button type="button" class="journey-top" aria-label="Back to top" hidden><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17"/><circle class="journey-top-progress" cx="20" cy="20" r="17"/></svg><span aria-hidden="true">↑</span></button>
