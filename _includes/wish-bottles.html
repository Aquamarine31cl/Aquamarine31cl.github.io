<section class="wish-panel" aria-labelledby="wish-heading">
<header class="wish-panel-heading"><h4 id="wish-heading">Wishes in Motion</h4><button type="button" class="wish-motion" aria-label="Pause Bottle Animations" aria-pressed="false">Ⅱ</button></header>
<div class="wish-pair">{% for bottle in site.data.wish_bottles.bottles %}
<div class="wish-item wish-item--{{ bottle.id }}">
<button class="wish-bottle" type="button" data-wish="{{ bottle.id }}" data-value="{{ bottle.value }}" data-capacity="{{ bottle.capacity }}" aria-label="{{ bottle.label }}: {{ bottle.value }} out of {{ bottle.capacity }}. Shake the wishing bottle.">
<svg viewBox="0 0 160 180" aria-hidden="true" focusable="false"><defs>
<clipPath id="wish-clip-{{ bottle.id }}"><path d="M69 31 Q80 28 91 31 L91 49 C91 57 96 65 100 75 Q103 82 111 83 L135 85 C146 86 148 92 139 99 L119 114 Q113 119 115 127 L120 147 C123 159 117 164 107 157 L87 143 Q80 138 73 143 L53 157 C43 164 37 159 40 147 L45 127 Q47 119 41 114 L21 99 C12 92 14 86 25 85 L49 83 Q57 82 60 75 C64 65 69 57 69 49 Z"/></clipPath>
<linearGradient id="wish-glass-{{ bottle.id }}" x2="1" y2="1"><stop stop-color="white" stop-opacity=".23"/><stop offset=".5" stop-color="white" stop-opacity=".02"/><stop offset="1" stop-color="white" stop-opacity=".15"/></linearGradient>
<linearGradient id="wish-liquid-{{ bottle.id }}" x2="0" y2="1"><stop class="wish-liquid-top"/><stop offset="1" class="wish-liquid-bottom"/></linearGradient></defs>
<g class="wish-vessel"><ellipse class="wish-rim" cx="80" cy="31" rx="12" ry="3"/>
<path d="M69 31 Q80 28 91 31 L91 49 C91 57 96 65 100 75 Q103 82 111 83 L135 85 C146 86 148 92 139 99 L119 114 Q113 119 115 127 L120 147 C123 159 117 164 107 157 L87 143 Q80 138 73 143 L53 157 C43 164 37 159 40 147 L45 127 Q47 119 41 114 L21 99 C12 92 14 86 25 85 L49 83 Q57 82 60 75 C64 65 69 57 69 49 Z" fill="url(#wish-glass-{{ bottle.id }})" class="wish-glass"/>
<g clip-path="url(#wish-clip-{{ bottle.id }})"><g class="wish-fill" transform="translate(0 {{ bottle.liquid_y }})">
<path class="wish-liquid" d="M0 0 Q40 -3 80 0 T160 0 V180 H0Z" fill="url(#wish-liquid-{{ bottle.id }})"/><path class="wish-surface" d="M0 0 Q40 -3 80 0 T160 0" fill="none"/>
</g><circle class="wish-bubble" cx="57" cy="135" r="2"/><circle class="wish-bubble wish-bubble--two" cx="99" cy="145" r="1.5"/>
<path class="wish-reflection" d="M68 70L60 92L31 94M47 143L53 125" fill="none"/></g>
<path d="M69 31 Q80 28 91 31 L91 49 C91 57 96 65 100 75 Q103 82 111 83 L135 85 C146 86 148 92 139 99 L119 114 Q113 119 115 127 L120 147 C123 159 117 164 107 157 L87 143 Q80 138 73 143 L53 157 C43 164 37 159 40 147 L45 127 Q47 119 41 114 L21 99 C12 92 14 86 25 85 L49 83 Q57 82 60 75 C64 65 69 57 69 49 Z" class="wish-outline" fill="none"/>
<path class="wish-caustic" d="M45 119 Q80 102 115 119 M52 129 Q80 117 108 129" fill="none"/>
<g class="wish-pisces" fill="none"><path d="M68 87Q78 98 68 109M92 87Q82 98 92 109M70 98H90"/><circle cx="80" cy="98" r="19"/></g>
<text x="80" y="123" class="wish-value" text-anchor="middle">{{ bottle.value }}</text>
<path class="wish-twinkle" d="M112 63v10m-5-5h10" fill="none"/>
<g class="wish-sparks"><circle cx="77" cy="30" r="1.6"/><circle cx="85" cy="31" r="1.2"/><circle cx="80" cy="29" r="1.4"/><circle cx="73" cy="31" r="1"/><circle cx="82" cy="30" r=".8"/><circle cx="76" cy="30" r="1.1"/><circle cx="78" cy="30" r="2"/><circle cx="84" cy="31" r="1.7"/><path d="M80 26l1.5 3 3 1-3 1-1.5 3-1.5-3-3-1 3-1Z"/><path d="M75 27l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1Z"/></g></g></svg>
</button></div>
{% endfor %}</div></section>
